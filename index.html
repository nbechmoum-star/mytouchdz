<body>

<!-- Top announcement bar -->
<div class="topbar">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
  <p>خدمة العملاء متوفرة 24/24سا لمشاكلكم نحن في الخدمة <span id="support-phone"></span></p>
</div>

<main class="page">
  <div class="hero">

    <!-- Product gallery (desktop, sticky) -->
    <div class="gallery gallery--desktop">
      <img id="product-image-desktop" src="" alt="">
    </div>

    <!-- Product info + order box -->
    <div class="product-panel">

      <h1 class="product-title">
        <span id="product-name"></span>
        <span class="badge badge--yellow" id="product-badge"></span>
      </h1>

      <p class="product-description" id="product-description"></p>

      <div class="price-row">
        <span class="price" id="product-price"></span>
        <span class="price-original" id="product-price-original"></span>
        <span class="discount-badge" id="product-discount-badge"></span>
      </div>

      <!-- Product gallery (mobile) -->
      <div class="gallery gallery--mobile">
        <img id="product-image-mobile" src="" alt="">
      </div>
      <div id="sticky-sentinel"></div>

      <div class="order-box">

        <!-- Sticky compact header (mobile only, appears once you scroll past the image) -->
        <div class="mobile-sticky-header" id="mobile-sticky-header">
          <div class="mobile-sticky-header__top">
            <p class="mobile-sticky-header__title" id="sticky-product-name"></p>
            <span class="badge badge--yellow" id="sticky-product-badge"></span>
          </div>
          <div class="mobile-sticky-header__bottom">
            <p class="mobile-sticky-header__price" id="sticky-product-price"></p>
            <div class="mobile-sticky-header__rating">
              <div class="stars" id="sticky-rating-stars" aria-label="">★★★★★</div>
              <span class="rating-value" id="sticky-rating-value"></span>
            </div>
          </div>
        </div>

        <form id="order-form" class="order-form">

          <div class="field-grid">
            <div class="field field--icon">
              <input type="text" id="name" name="name" placeholder="الاسم الكامل" required>
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="field field--icon">
              <input type="tel" id="phone" name="phone" placeholder="رقم الهاتف" minlength="10" maxlength="10" autocomplete="off" required>
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
          </div>

          <div class="field-grid">
            <div class="field field--icon">
              <select id="city" name="commune" disabled>
                <option value="">اختر البلدية</option>
              </select>
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22a1 1 0 0 1-1-1v-4a1 1 0 0 1 .445-.832l3-2a1 1 0 0 1 1.11 0l3 2A1 1 0 0 1 22 17v4a1 1 0 0 1-1 1z"/><path d="M18 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 .601.2"/><path d="M18 22v-3"/><circle cx="10" cy="10" r="3"/></svg>
            </div>
            <div class="field field--icon">
              <select id="wilaya" name="state" required>
                <option value="" selected>الولاية</option>
              </select>
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
          </div>

          <div class="delivery-hint">
            <span class="badge badge--orange" id="delivery-badge">اختر الولاية</span>
            <span class="delivery-hint__label">سعر التوصيل 🚚</span>
          </div>

          <!-- Quantity packages (generated from assets/js/product-details.js) -->
          <div class="packages" id="packages"></div>
          <input type="hidden" id="qty" value="1">

          <!-- Delivery method (populated once a wilaya with courier pricing is chosen) -->
          <div class="delivery-section" id="delivery-section">
            <span class="delivery-section__label">طريقة التوصيل</span>
            <div class="delivery-grid">
              <button type="button" class="delivery-card delivery-card--active" id="dc-home">
                <svg class="delivery-card__check" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                <span class="delivery-card__icon">🏠</span>
                <span class="delivery-card__label">توصيل للمنزل</span>
                <span class="delivery-card__sub">يصلك على بابك</span>
                <span class="delivery-card__price" id="dc-home-price">—</span>
              </button>
              <button type="button" class="delivery-card" id="dc-desk">
                <svg class="delivery-card__check" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                <span class="delivery-card__icon">📦</span>
                <span class="delivery-card__label">ستوب ديسك</span>
                <span class="delivery-card__sub">تستلمه من الوكالة</span>
                <span class="delivery-card__price" id="dc-desk-price">—</span>
              </button>
            </div>
          </div>

          <div class="field field--textarea">
            <textarea id="notes" name="notes" placeholder="ملاحظات (اختياري)"></textarea>
          </div>

          <!-- Hidden single-variant placeholders (sheets-orders.js expects a variant system) -->
          <div id="vc-oil" hidden><span class="variant-label" id="variant-label-full"></span></div>
          <button type="button" class="fv-btn active" id="fv-oil" hidden><span class="fv-label" id="variant-label-short"></span></button>

          <button type="button" class="buy-btn submit-btn">
            <span class="buy-btn__price-tag"><b id="buy-btn-price">1990</b> دج</span>
            <span class="buy-btn__label">اشتري الان</span>
          </button>
        </form>

        <!-- Order summary (collapsible) -->
        <button type="button" class="summary-toggle" id="summary-toggle" aria-expanded="true">
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9l-7 7-7-7"/></svg>
          <span class="summary-toggle__text">
            <strong>ملخص الطلبية</strong>
            <small id="summary-count">1 منتج محدد</small>
          </span>
        </button>

        <div class="summary" id="summary">
          <div class="summary__line">
            <div class="summary__item">
              <span class="summary__qty" id="summary-qty">× 1</span>
              <span class="summary__unit-price" id="summary-unit-price">1990 دج</span>
            </div>
            <span class="summary__name" id="summary-name"></span>
            <img class="summary__thumb" id="summary-thumb" src="" alt="">
          </div>
          <div class="summary__row">
            <span>سعر التوصيل</span>
            <span id="summary-delivery">اختر الولاية</span>
          </div>
          <div class="summary__row summary__row--total">
            <span>المجموع الكلي</span>
            <span id="summary-total">1990 دج</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sticky mobile buy bar -->
  <div class="mobile-buybar">
    <a href="tel:" id="call-link" class="mobile-buybar__call">
      <img id="buybar-logo" src="" alt="اتصل بنا">
    </a>
    <a href="#" id="whatsapp-link" target="_blank" rel="noopener" class="mobile-buybar__whatsapp" aria-label="تواصل معنا عبر واتساب">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.03c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.3-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.98.88 2.12.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.37-.42.49-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.63-.14.26.09 1.65.78 1.93.92.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
    </a>
    <button type="button" class="mobile-buybar__cta" id="mobile-buy-btn">
      <span class="mobile-buybar__info">
        <b id="mobile-buy-price"></b>
        <small id="mobile-buy-label"></small>
      </span>
      <span class="mobile-buybar__label">
        اشتري الان
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>
    </button>
  </div>

  <!-- Floating WhatsApp button (all screen sizes) -->
  <a href="#" id="whatsapp-fab" target="_blank" rel="noopener" class="whatsapp-fab" aria-label="تواصل معنا عبر واتساب">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.03c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.3-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.98.88 2.12.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.37-.42.49-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.63-.14.26.09 1.65.78 1.93.92.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
  </a>

  <!-- Customer testimonials -->
  <section class="testimonials">
    <p class="testimonials__heading" id="testimonials-heading"></p>
    <div class="testimonials__grid" id="testimonials-grid"></div>
  </section>
</main>
